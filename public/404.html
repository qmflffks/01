<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect trick
      // 현재 경로를 sessionStorage에 저장하고 앱 루트로 리다이렉트
      sessionStorage.setItem('redirectPath', location.pathname + location.search + location.hash);
      location.replace(location.origin + '/01/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
